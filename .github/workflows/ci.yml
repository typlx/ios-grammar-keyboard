name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (iOS 15+)
    runs-on: macos-14

    env:
      SCHEME: TypistKeyboard
      DESTINATION: "platform=iOS Simulator,name=iPhone 15,OS=latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Build
        run: |
          xcodebuild \
            -project TypistKeyboard.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty || true

      - name: Unit Tests
        run: |
          mkdir -p test-results
          xcodebuild test \
            -project TypistKeyboard.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:TypistKeyboardTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output test-results/unit-junit.xml || true

      - name: UI Tests
        run: |
          xcodebuild test \
            -project TypistKeyboard.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:TypistKeyboardUITests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output test-results/ui-junit.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict
